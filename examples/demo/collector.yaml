receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  jevmetrics:
    api_key: ${env:JEV_API_KEY}
    base_url: ${env:JEV_BASE_URL}
    model: ${env:JEV_MODEL}
    mode: annotate
    rate_limit:
      requests_per_second: 2
      burst: 1
    policy:
      score_ttl: 30s
  batch:
    timeout: 1s
exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_units: false
                without_type_suffix: false
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, jevmetrics, batch]
      exporters: [prometheus]
